name: Build LUXCAST
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix structure
        shell: pwsh
        run: |
          dir
          # Crear carpetas si no existen
          New-Item -ItemType Directory -Force -Path src | Out-Null
          New-Item -ItemType Directory -Force -Path src-tauri | Out-Null
          New-Item -ItemType Directory -Force -Path src-tauri/src | Out-Null
          # Mover archivos sueltos a su lugar
          if (Test-Path./App.tsx) { Move-Item./App.tsx./src/App.tsx -Force }
          if (Test-Path./main.js) { Move-Item./main.js./src/main.js -Force }
          if (Test-Path./Cargo.toml) { Move-Item./Cargo.toml./src-tauri/Cargo.toml -Force }
          if (Test-Path./tauri.conf.json) { Move-Item./tauri.conf.json./src-tauri/tauri.conf.json -Force }
          # Crear main.rs si no existe
          if (-not (Test-Path./src-tauri/src/main.rs)) {
            "#![cfg_attr(not(debug_assertions), windows_subsystem = ""windows"")]`nfn main(){tauri::Builder::default().run(tauri::generate_context!()).expect(""error"");}" | Out-File./src-tauri/src/main.rs -Encoding utf8
          }
          if (-not (Test-Path./src-tauri/build.rs)) { "fn main(){tauri_build::build()}" | Out-File./src-tauri/build.rs -Encoding utf8 }
          if (-not (Test-Path./src-tauri/icons/icon.png)) {
            New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
            # icon 1x1
            $b64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII="
            [IO.File]::WriteAllBytes("./src-tauri/icons/icon.png", [Convert]::FromBase64String($b64))
          }
          # Fix tauri.conf
          Get-Content./src-tauri/tauri.conf.json | Out-String
          dir -Recurse

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: npm install

      - name: Build frontend
        run: npm run build --if-present
        continue-on-error: true

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Tauri Build
        run: cargo tauri build

      - name: Release EXE
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          tag_name: v0.1.0
          name: LUXCAST 12MB
          body: Instalador LUXCAST - 12MB con OBS Virtual
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
