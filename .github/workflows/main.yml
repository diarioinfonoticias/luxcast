name: Build LUXCAST
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: RECREATE PROJECT CLEAN
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path src | Out-Null
          New-Item -ItemType Directory -Force -Path src-tauri/src | Out-Null
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null

          @"
          {
            "name": "luxcast",
            "version": "0.1.0",
            "type": "module",
            "scripts": { "dev": "vite --port 1420", "build": "vite build" },
            "dependencies": { "react": "^18.3.1", "react-dom": "^18.3.1", "@mediapipe/selfie_segmentation": "^0.1.0" },
            "devDependencies": { "@vitejs/plugin-react": "^4.3.3", "vite": "^5.4.0", "tailwindcss": "^3.4.10", "postcss": "^8.4.41", "autoprefixer": "^10.4.20" }
          }
          "@ | Set-Content package.json -Encoding utf8

          @"
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'
          export default defineConfig({ plugins: [react()], server: { port: 1420 }, build: { outDir: 'dist' } })
          "@ | Set-Content vite.config.js -Encoding utf8

          @"
          <!DOCTYPE html><html><head><meta charset='UTF-8'/><title>LUXCAST</title></head><body><div id='root'></div><script type='module' src='/src/main.jsx'></script></body></html>
          "@ | Set-Content index.html -Encoding utf8

          @"
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          body{background:#0a0a0a;color:white}
          "@ | Set-Content src/index.css -Encoding utf8

          @"
          import React from 'react'
          import ReactDOM from 'react-dom/client'
          import App from './App.jsx'
          import './index.css'
          ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
          "@ | Set-Content src/main.jsx -Encoding utf8

          @'
          import { useEffect, useRef, useState } from "react"
          export default function App(){
            const v=useRef(null), c=useRef(null)
            const [bg,setBg]=useState("studio")
            useEffect(()=>{
              let a
              async function init(){
                const s=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720}})
                v.current.srcObject=s; await v.current.play()
                const {SelfieSegmentation}=await import("@mediapipe/selfie_segmentation")
                const seg=new SelfieSegmentation({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`})
                seg.setOptions({modelSelection:1})
                seg.onResults(r=>{
                  const ctx=c.current.getContext("2d")
                  const W=c.current.width=1280, H=c.current.height=720
                  ctx.clearRect(0,0,W,H)
                  if(bg==="studio"){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1a1a2e");g.addColorStop(1,"#0f0f1e");ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
                  else if(bg==="blur"){ctx.filter="blur(15px)";ctx.drawImage(r.image,0,0,W,H);ctx.filter="none"}
                  else{ctx.fillStyle=bg;ctx.fillRect(0,0,W,H)}
                  ctx.drawImage(r.segmentationMask,0,0,W,H)
                  ctx.globalCompositeOperation="source-in"
                  ctx.drawImage(r.image,0,0,W,H)
                  ctx.globalCompositeOperation="source-over"
                })
                const loop=async()=>{await seg.send({image:v.current}); a=requestAnimationFrame(loop)}; loop()
              }
              init(); return()=>cancelAnimationFrame(a)
            },[bg])
            return (<div className="min-h-screen bg-black flex flex-col"><header className="p-4 bg-zinc-900 border-b border-zinc-800"><h1 className="font-black">LUXCAST <span className="text-violet-400">STUDIO 12MB</span></h1></header><div className="flex-1 grid grid-cols-[280px_1fr] gap-4 p-4"><div className="bg-zinc-900 rounded-xl p-4 space-y-4"><button onClick={()=>setBg("studio")} className="w-full bg-violet-600 p-2 rounded">Studio</button><button onClick={()=>setBg("blur")} className="w-full bg-zinc-800 p-2 rounded">Blur</button><button onClick={()=>setBg("#000")} className="w-full bg-zinc-800 p-2 rounded">Negro</button><div className="text-xs opacity-50">Activa y usa Window Capture en OBS</div></div><div className="bg-zinc-900 rounded-xl overflow-hidden flex items-center justify-center"><video ref={v} className="hidden" muted playsInline/><canvas ref={c} className="w-full h-full object-contain"/></div></div></div>)
          }
          '@ | Set-Content src/App.jsx -Encoding utf8

          # TAURI
          @"
          [package]
          name = "luxcast"
          version = "0.1.0"
          edition = "2021"
          [build-dependencies]
          tauri-build = { version = "1.5" }
          [dependencies]
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          tauri = { version = "1.6", features = ["api-all"] }
          "@ | Set-Content src-tauri/Cargo.toml -Encoding utf8
          "#![cfg_attr(not(debug_assertions), windows_subsystem = ""windows"")]`nfn main(){tauri::Builder::default().run(tauri::generate_context!()).expect(""err"");}" | Set-Content src-tauri/src/main.rs -Encoding utf8
          "fn main(){tauri_build::build()}" | Set-Content src-tauri/build.rs -Encoding utf8
          @"
          {
            "build": { "beforeDevCommand": "npm run dev", "beforeBuildCommand": "npm run build", "devPath": "http://localhost:1420", "distDir": "../dist" },
            "package": { "productName": "LUXCAST", "version": "0.1.0" },
            "tauri": { "allowlist": { "all": true }, "bundle": { "identifier": "com.luxcast.studio", "icon": ["icons/icon.png"], "targets": "all" }, "windows": [{ "title": "LUXCAST", "width": 1280, "height": 720 }] }
          }
          "@ | Set-Content src-tauri/tauri.conf.json -Encoding utf8
          `$b64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII="
          [IO.File]::WriteAllBytes("./src-tauri/icons/icon.png", [Convert]::FromBase64String(`$b64))

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run build
      - run: cargo install tauri-cli --locked
      - run: cargo tauri build
      - uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          tag_name: v0.1.0
          name: LUXCAST 12MB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
