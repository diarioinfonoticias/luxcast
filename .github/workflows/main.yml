name: Build LUXCAST
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter *.zip | Select-Object -First 1
          Write-Host "Usando ZIP: $($zip.Name)"
          Expand-Archive -Path $zip.FullName -DestinationPath temp_extract -Force
          Copy-Item -Path temp_extract/* -Destination. -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path temp_extract/luxcast) { Copy-Item -Path temp_extract/luxcast/* -Destination. -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path temp_extract/LUXCAST_FINAL) { Copy-Item -Path temp_extract/LUXCAST_FINAL/* -Destination. -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path temp_extract/LUXCAST_FINAL/luxcast) { Copy-Item -Path temp_extract/LUXCAST_FINAL/luxcast/* -Destination. -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path luxcast) { Copy-Item -Path luxcast/* -Destination. -Recurse -Force -ErrorAction SilentlyContinue }
          dir
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm install @mediapipe/selfie_segmentation
      - run: cargo install tauri-cli --locked
      - run: cargo tauri build
      - uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          tag_name: v0.1.0
          name: LUXCAST 12MB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
