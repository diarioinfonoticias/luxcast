name: Build LUXCAST
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        shell: pwsh
        run: |
          Expand-Archive -Path LUXCAST_FINAL.zip -DestinationPath temp_extract -Force
          Copy-Item -Path temp_extract/* -Destination. -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path temp_extract/luxcast) { Copy-Item -Path temp_extract/luxcast/* -Destination. -Recurse -Force }
          if (Test-Path luxcast) { Copy-Item -Path luxcast/* -Destination. -Recurse -Force }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm install @mediapipe/selfie_segmentation
      - run: cargo install tauri-cli --locked
      - run: cargo tauri build
      - uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          tag_name: v0.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
